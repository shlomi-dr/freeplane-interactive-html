<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__MAP_TITLE__</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; font: 14px system-ui, sans-serif; color: #213047; background: #f6f8fb; }
  header { flex: none; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 12px; background: white; border-bottom: 1px solid #d8dfe8; }
  h1 { flex: 1 1 180px; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
  nav { display: flex; flex: 0 1 auto; flex-wrap: wrap; max-width: 100%; gap: 5px; align-items: center; }
  button, input { height: 32px; font: inherit; border: 1px solid #aab7c8; border-radius: 5px; background: white; padding: 4px 8px; }
  button { flex: none; cursor: pointer; } button:hover { background: #edf3fc; }
  button:focus-visible, input:focus-visible { outline: 2px solid #175cce; outline-offset: 2px; }
  .icon-button { width: 32px; padding: 0; font-size: 18px; }
  #toggle-all svg { width: 20px; height: 20px; vertical-align: middle; pointer-events: none; }
  input { flex: 1 1 150px; min-width: 100px; width: 190px; max-width: 100%; }
  @media (max-width: 850px) { h1 { flex-basis: 140px; } input { width: 170px; } }
  #status { color: #586779; font-size: 12px; }
  #canvas { display: block; flex: 1; min-height: 0; width: 100%; touch-action: none; cursor: grab; background: #d6e8e8ff; }
  #canvas.dragging { cursor: grabbing; }
  .edge { fill: none; stroke: #a2afc0; stroke-width: 1.5; }
  .summary-edge { fill: none; stroke: #62788b; stroke-width: 1.8; }
  .crosslink { fill: none; }
  .artwork { pointer-events: none; }
  .node-link { cursor: pointer; }
  .node-link:focus-visible .link-hitarea { stroke: #175cce; stroke-width: 3; }
  .node-highlight { fill: #ffcc0030; stroke: #d69000; stroke-width: 3; rx: 7; pointer-events: none; }
  .toggle { cursor: pointer; outline: none; } .toggle circle { fill: white; stroke: #667c96; stroke-width: 1.5; }
  .toggle:focus circle { stroke: #175cce; stroke-width: 3; }
  .toggle text { font: 16px system-ui; text-anchor: middle; dominant-baseline: central; fill: #213047; pointer-events: none; }
</style>
<header>
  <h1 title="__MAP_TITLE__">__MAP_TITLE__</h1>
  <nav aria-label="Map controls">
    <button id="fit" title="Fit map" aria-label="Fit map">Fit</button><button id="toggle-all" class="icon-button" title="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 11 L12 6 L17 11 M7 18 L12 13 L17 18"/></svg></button><button id="zoom-out" class="icon-button" title="Zoom out" aria-label="Zoom out">−</button><button id="zoom-in" class="icon-button" title="Zoom in" aria-label="Zoom in">+</button>
    <input id="search" type="search" aria-label="Search all nodes" placeholder="Search nodes…">
    <button id="next" class="icon-button" title="Next match" aria-label="Next match">→</button><span id="status" role="status" aria-live="polite"></span>
  </nav>
</header>
<svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive mind map"><g id="viewport"><g id="edges"></g><g id="crosslinks"></g><g id="nodes"></g></g></svg>
<script id="manifest" type="application/json">/*__MANIFEST__*/</script>
<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('manifest').textContent);
  const NS = 'http://www.w3.org/2000/svg';
  const canvas = document.getElementById('canvas'), viewport = document.getElementById('viewport');

  const linkLayer = document.getElementById('crosslinks');
  const status = document.getElementById('status'), searchInput = document.getElementById('search');
  const nodes = data.nodes.map(n => ({ ...n, children: [], collapsed: false, visible: false, x: 0, y: 0 }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  nodes.forEach(n => { if (n.parentId != null) byId.get(n.parentId).children.push(n); });

  const summaries = (data.summaries || []).map(s => ({ ...s, members: s.memberIds.map(id => byId.get(id)), labels: s.summaryChildIds.map(id => byId.get(id)) }));
  const links = data.links || [];
  const isContent = n => !n.firstGroup && !n.summary;
  nodes.forEach(n => {
    const groups = summaries.filter(s => s.parentId === n.id);
    const groupedIds = new Set(groups.flatMap(s => [...s.memberIds, s.markerId, s.startMarkerId]));
    n.items = [];
    n.children.forEach(c => {
      const group = groups.find(s => s.memberIds[0] === c.id);
      if (group) n.items.push(group);
      else if (isContent(c) && !groupedIds.has(c.id)) n.items.push(c);
    });
  });
  const collapsibleNodes = contentNodes.filter(n => n.items.length && !n.alwaysUnfolded);
  const toggleAll = document.getElementById('toggle-all'), toggleAllIcon = toggleAll.querySelector('path');
  let visibleLinks = 0;
  let scale = 1, panX = 30, panY = 30, matches = [], matchIndex = -1, query = '', activeId = null;
  const el = (name, attrs = {}) => { const e = document.createElementNS(NS, name); Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v)); return e; };

  nodes.forEach((n,index) => {

    n.highlight = el('rect', { class: 'node-highlight', x: -5, y: -5, width: n.width + 10, height: n.height + 10, visibility: 'hidden' });
    n.group.append(n.highlight);
    const nodeArtwork = artwork(n.artwork, index, n.width, n.height);
    const href = typeof n.linkHref === 'string' && /^(https?:\/\/|mailto:)/i.test(n.linkHref) ? n.linkHref : null;
    let validHref = null;
    if (href) {
      try { const url = new URL(href); if (['http:', 'https:', 'mailto:'].includes(url.protocol)) validHref = href; } catch {}
    }
    if (validHref) {
      const anchor = el('a', { class: 'node-link', href: validHref, target: '_blank', rel: 'noopener noreferrer', 'aria-label': `Open link: ${n.label}`, tabindex: 0 });

      anchor.append(title, nodeArtwork, el('rect', { class: 'link-hitarea', x: 0, y: 0, width: n.width, height: n.height, fill: 'transparent', 'pointer-events': 'all' }));
      n.group.append(anchor);
    } else n.group.append(nodeArtwork);
    if (n.items.length && !n.alwaysUnfolded) {
      n.button = el('g', { class: 'toggle', role: 'button', tabindex: 0, transform: `translate(${n.left ? -15 : n.width + 15},${n.height / 2})` });
      n.button.append(el('circle', { r: 10 })); n.sign = el('text'); n.button.append(n.sign);
      n.button.addEventListener('click', () => toggle(n.id));
      n.button.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(n.id); } });
      n.group.append(n.button);
    }
    nodeLayer.append(n.group);
  });
  function transform() { viewport.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`); }

    toggleAll.setAttribute('title', label); toggleAll.setAttribute('aria-label', label);
    toggleAllIcon.setAttribute('d', expand ? 'M7 6 L12 11 L17 6 M7 13 L12 18 L17 13' : 'M7 11 L12 6 L17 11 M7 18 L12 13 L17 18');
    const visibleNodes = contentNodes.filter(n => n.visible).length;
    const count = (visible, total) => visible === total ? total : `${visible}/${total}`;
    status.textContent = `${count(visibleNodes, contentNodes.length)} nodes · ${count(visibleLinks, links.length)} links` + (query ? ` · ${matches.length ? `${matchIndex + 1}/${matches.length} matches` : 'No matches'}` : '');
  }
  function layout() {
    nodes.forEach(n => { n.visible = false; });
    const span = items => items.reduce((sum,c) => sum + c.span, 0) + 24 * Math.max(0, items.length - 1);
    const leftOf = item => item.members ? item.members[0].left : item.left;
    function measure(n) {
      n.visible = true;
      if (n.collapsed || !n.items.length) n.span = n.height;
      else {
        n.items.forEach(item => {
          if (item.members) {
            [...item.members, ...item.labels].forEach(measure);
            item.span = Math.max(span(item.members), span(item.labels));

        });
        n.span = n === root ? Math.max(n.height, span(n.items.filter(leftOf)), span(n.items.filter(c => !leftOf(c)))) : Math.max(n.height, span(n.items));
      }

    }
    function subtree(n) { return n.visible ? [n, ...n.children.flatMap(subtree)] : n.children.flatMap(subtree); }
    function positionStack(children, xFor, centerY) {
      let top = centerY - span(children) / 2;
      children.forEach(c => { position(c, xFor(c), top + c.span / 2); top += c.span + 24; });
    }
    function position(n, x, centerY) {
      n.x = x; n.y = centerY - n.height / 2;
      if (n.collapsed) return;
      const sides = n === root ? [n.items.filter(leftOf), n.items.filter(c => !leftOf(c))] : [n.items];
      sides.forEach(items => {
        let top = centerY - span(items) / 2;
        items.forEach(item => {
          const center = top + item.span / 2;
          const childX = c => c.left ? x - 85 - c.width : x + n.width + 85;
          if (item.members) {
            positionStack(item.members, childX, center);
            const members = item.members.flatMap(subtree), left = item.members[0].left;
            const outer = left ? Math.min(...members.map(c => c.x)) : Math.max(...members.map(c => c.x + c.width));
            item.bracketX = outer + (left ? -30 : 30);
            item.minY = Math.min(...members.map(c => c.y));
            item.maxY = Math.max(...members.map(c => c.y + c.height));
            item.centerY = center;
            positionStack(item.labels, c => left ? outer - 85 - c.width : outer + 85, center);
          } else position(item, childX(item), center);
          top += item.span + 24;
        });
      });
    }
    measure(root); position(root, 0, 0); edgeLayer.replaceChildren(); linkLayer.replaceChildren();

      n.group.style.display = n.visible ? '' : 'none';
      if (!n.visible) return;
      n.group.setAttribute('transform', `translate(${n.x},${n.y})`);
      n.highlight.setAttribute('visibility', n.id === activeId ? 'visible' : 'hidden');
      if (n.button) { n.sign.textContent = n.collapsed ? '+' : '−'; n.button.setAttribute('aria-expanded', !n.collapsed); n.button.setAttribute('aria-label', `${n.collapsed ? 'Expand' : 'Collapse'} ${n.label}`); }

        const x1 = n.left ? p.x - (p.left ? 26 : 0) : p.x + p.width + 26, y1 = p.y + p.height / 2, x2 = n.left ? n.x + n.width : n.x, y2 = n.y + n.height / 2, mid = (x1 + x2) / 2;
        edgeLayer.append(el('path', { class: 'edge', 'data-target-id': n.id, d: `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}` }));
      }
    });
    summaries.forEach(s => {
      if (!s.members.some(n => n.visible)) return;
      const tick = s.members[0].left ? 12 : -12, x = s.bracketX, mid = (s.minY + s.maxY) / 2;
      edgeLayer.append(el('path', { class: 'summary-edge', 'data-summary-id': s.markerId, d: `M${x + tick},${s.minY} H${x} V${s.maxY} H${x + tick}` }));
      s.labels.filter(n => n.visible).forEach(n => {
        const endX = n.left ? n.x + n.width : n.x, endY = n.y + n.height / 2;
        edgeLayer.append(el('path', { class: 'summary-edge', d: `M${x},${mid} L${endX},${endY}` }));
      });
    });
    visibleLinks = 0;
    links.forEach(link => {
      const from = byId.get(link.sourceId), to = byId.get(link.targetId);
      if (!from?.visible || !to?.visible) return;
      const style = link.resolved, geometry = link.geometry;
      if (!style || !geometry || style.shape !== 'CUBIC_CURVE' || geometry.zoom !== 1) throw new Error('Unsupported native connector capture');
      const x1 = from.x + geometry.sourceAnchor.x, y1 = from.y + geometry.sourceAnchor.y;
      const x2 = to.x + geometry.targetAnchor.x, y2 = to.y + geometry.targetAnchor.y;
      const attrs = { class: 'crosslink', 'data-source-id': from.id, 'data-target-id': to.id,
        stroke: style.color, 'stroke-width': geometry.strokeWidth, 'stroke-opacity': style.alpha / 255,
        'stroke-dasharray': geometry.strokeDash.length ? geometry.strokeDash.join(' ') : 'none',

        linkLayer.append(el('polygon', { 'data-arrow-end': arrow.end,
          points: arrow.points.map(p => `${x + p.x},${y + p.y}`).join(' '),
          fill: style.color, 'fill-opacity': style.alpha / 255, stroke: style.color, 'stroke-opacity': style.alpha / 255,
          'stroke-width': geometry.strokeWidth, 'stroke-linecap': attrs['stroke-linecap'], 'stroke-linejoin': attrs['stroke-linejoin'],

  }
  function toggle(id) { const n = byId.get(id); if (n && isContent(n) && n.items.length && !n.alwaysUnfolded) { n.collapsed = !n.collapsed; layout(); } }
  function size() { return canvas.getBoundingClientRect(); }

  document.getElementById('zoom-in').addEventListener('click', () => zoom(1.25)); document.getElementById('zoom-out').addEventListener('click', () => zoom(.8));

</script>
